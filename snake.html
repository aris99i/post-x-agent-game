<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ULAR — satu prompt, satu game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f14;
    color: #f2f2f2;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
  }
  h1 { font-size: 28px; letter-spacing: 6px; color: #4ade80; }
  h1 span { color: #c41c83; }
  #hud {
    width: min(480px, 94vw);
    display: flex;
    justify-content: space-between;
    font-size: 18px;
  }
  #hud b { color: #4ade80; }
  #hud .best { color: #9aa0a6; }
  canvas {
    width: min(480px, 94vw);
    height: auto;
    aspect-ratio: 4 / 5;
    background: #12151d;
    border: 2px solid #2a2f3a;
    border-radius: 12px;
    touch-action: none;
  }
  #msg {
    min-height: 24px;
    font-size: 16px;
    color: #e8e8e8;
    text-align: center;
  }
  #msg .key { color: #c41c83; font-weight: bold; }
  footer { font-size: 12px; color: #6b7280; text-align: center; }
  footer a { color: #c41c83; text-decoration: none; }
</style>
</head>
<body>
  <h1>UL<span>A</span>R</h1>
  <div id="hud">
    <div>SKOR <b id="score">0</b></div>
    <div class="best">TERBAIK <span id="best">0</span></div>
  </div>
  <canvas id="game" width="480" height="600"></canvas>
  <div id="msg">Tekan <span class="key">spasi</span> atau ketuk layar buat mulai</div>
  <footer>Dibangun AI agent dari satu prompt &middot; <a href="https://make.fun">make.fun</a></footer>

<script>
"use strict";
// ULAR — Snake mini dari satu prompt. Grid 24 x 30, satu file, tanpa dependensi.
const COLS = 24, ROWS = 30, CELL = 20;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const msgEl = document.getElementById("msg");

let snake, dir, nextDir, food, score, best, timer, speed, state;

function loadBest() {
  try { best = Number(localStorage.getItem("ular-best") || 0) || 0; }
  catch (e) { best = 0; }
  bestEl.textContent = best;
}

function saveBest() {
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("ular-best", String(best)); } catch (e) {}
  }
}

function reset() {
  snake = [{ x: 12, y: 15 }, { x: 11, y: 15 }, { x: 10, y: 15 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  speed = 150;
  scoreEl.textContent = "0";
  placeFood();
  state = "ready";
  msgEl.innerHTML = 'Tekan <span class="key">spasi</span> atau ketuk layar buat mulai';
  draw();
}

function placeFood() {
  while (true) {
    const f = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS),
    };
    const onSnake = snake.some((s) => s.x === f.x && s.y === f.y);
    if (!onSnake) { food = f; return; }
  }
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) { gameOver(); return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = String(score);
    speed = Math.max(70, 150 - Math.floor(score / 30) * 10);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#12151d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // grid samar
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
  }
  // makanan: magenta make.fun
  ctx.fillStyle = "#c41c83";
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.42, 0, Math.PI * 2);
  ctx.fill();
  // ular: hijau, kepala lebih terang
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#86efac" : "#4ade80";
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  });
  if (state === "over") {
    ctx.fillStyle = "rgba(13,15,20,0.82)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#f2f2f2";
    ctx.font = "bold 44px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = "22px monospace";
    ctx.fillStyle = "#4ade80";
    ctx.fillText("Skor " + score, canvas.width / 2, canvas.height / 2 + 34);
  }
}

function start() {
  if (state === "running") return;
  if (state === "over") reset();
  state = "running";
  msgEl.textContent = "Panah / WASD buat belok — R buat ulang";
  clearInterval(timer);
  timer = setInterval(step, speed);
  // percepat tiap makanan dimakan
  const watcher = setInterval(() => {
    if (state !== "running") { clearInterval(watcher); return; }
    clearInterval(timer);
    timer = setInterval(step, speed);
  }, 500);
}

function gameOver() {
  state = "over";
  clearInterval(timer);
  saveBest();
  msgEl.innerHTML = 'GAME OVER — tekan <span class="key">R</span> atau ketuk buat main lagi';
  draw();
}

// jeda otomatis kalau tab ditinggal, biar ular nggak mati diam-diam
function pause() {
  if (state !== "running") return;
  state = "paused";
  clearInterval(timer);
  msgEl.innerHTML = 'Jeda — tekan <span class="key">spasi</span> buat lanjut';
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pause();
});

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return; // dilarang putar balik
  if (dir.x === x && dir.y === y) return;
  nextDir = { x, y };
}

const KEYS = {
  ArrowUp: [0, -1], KeyW: [0, -1],
  ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0],
  ArrowRight: [1, 0], KeyD: [1, 0],
};
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); start(); return; }
  if (e.code === "KeyR") { reset(); start(); return; }
  const d = KEYS[e.code];
  if (d) { e.preventDefault(); setDir(d[0], d[1]); if (state === "ready") start(); }
});

// swipe di layar sentuh
let touchStart = null;
canvas.addEventListener("touchstart", (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { start(); return; }
  if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
  else setDir(0, Math.sign(dy));
  if (state === "ready") start();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("click", () => start());

loadBest();
reset();
</script>
</body>
</html>
